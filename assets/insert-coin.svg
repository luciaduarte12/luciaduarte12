
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <style>
    .marco {
      fill: #0A1128;
      stroke: #2DE2E6;
      stroke-width: 4;
    }
    .titulo {
      fill: #2DE2E6;
      font-family: "Courier New", monospace;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 4px;
    }
    .coin {
      fill: #FF4DA6;
      font-family: "Courier New", monospace;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 6px;
      animation: parpadeo 1.2s infinite;
    }
    @keyframes parpadeo {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <rect class="marco" x="4" y="4" width="792" height="192" rx="8" />
  <text class="titulo" x="400" y="60" text-anchor="middle">LUCÍA DUARTE · ARCADE</text>
  <text class="coin" x="400" y="130" text-anchor="middle">INSERT COIN</text>
</svg>
